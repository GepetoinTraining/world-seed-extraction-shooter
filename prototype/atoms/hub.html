<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>World Seed People</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; padding: 24px; background: #050505; color: #d4d4d8; font: 13px/1.5 ui-monospace, Menlo, Consolas, monospace; }
  h1 { font-size: 16px; color: #20de81; letter-spacing: 0.1em; margin: 0 0 4px; }
  h2 { font-size: 13px; color: #ffd700; letter-spacing: 0.08em; margin: 28px 0 8px; border-bottom: 1px solid #27272a; padding-bottom: 4px; }
  p { margin: 0 0 8px; color: #a1a1aa; max-width: 900px; }
  a { color: #20de81; }
  canvas { image-rendering: pixelated; display: block; }
  .row { display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-end; }
  .cell { display: flex; flex-direction: column; gap: 4px; align-items: flex-start; }
  .label { font-size: 11px; color: #a1a1aa; max-width: 150px; }
  button { background: #0a0a0a; color: #20de81; border: 1px solid #20de81; font: inherit; padding: 4px 12px; cursor: pointer; }
  button[aria-pressed="true"] { background: #20de81; color: #050505; }
  .stage { display: flex; gap: 16px; align-items: flex-start; flex-wrap: wrap; }
  #hub-view { outline: 1px solid #3f3f46; }
  #hub-view:focus { outline: 2px solid #20de81; }
  .panel { width: 300px; display: flex; flex-direction: column; gap: 10px; }
  .box { background: #0a0a0a; border: 2px solid #52525b; padding: 8px; }
  .box-title { color: #fafafa; font-weight: 700; }
  .line { color: #e4e4e7; margin: 6px 0; }
  .opt { color: #a1a1aa; font-size: 12px; }
  .hint { color: #a1a1aa; font-size: 12px; }
  .controls { display: flex; flex-wrap: wrap; gap: 6px; }
</style>
</head>
<body>
  <h1>WORLD SEED // THE PEOPLE AND THE CITY</h1>
  <p>Every pixel below comes from a certificate id or the real hub layout. There are no image files. <a href="./index.html">Back to the atoms</a>.</p>
  <button id="gray" aria-pressed="false">Grayscale</button>
  <div id="root"></div>
  <script type="module" src="./hubPage.ts"></script>
</body>
</html>
